<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MindFlow</title>
    <script type="text/javascript">
      // GitHub Pages doesn't natively support SPAs.
      // When a user requests https://aklabx.github.io/MindFlow/dashboard,
      // GitHub Pages returns this 404.html file.
      // This script will immediately redirect the browser to the HashRouter format:
      // https://aklabx.github.io/MindFlow/#/dashboard

      var pathSegmentsToKeep = 1;

      var l = window.location;
      var repoPath = '/' + l.pathname.split('/')[1]; // usually '/MindFlow'

      // Check if we are already correctly formatted (shouldn't happen on a 404, but just in case)
      if (l.pathname !== repoPath && l.pathname !== repoPath + '/') {
          var newPath = repoPath + '/#/' + l.pathname.slice(repoPath.length + 1).replace(/^\/+/, '') + l.search + l.hash;
          l.replace(newPath);
      }
    </script>
  </head>
  <body>
    <!-- Redirecting... -->
  </body>
</html>
