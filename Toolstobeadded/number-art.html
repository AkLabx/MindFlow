<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Art</title>
<style>
:root{--bg:#f1f3f2;--card:#fff;--ink:#14201b;--mute:#62716a;--line:#d3dad6;--acc:#0f7a5a;--accink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#17211c;--ink:#e8f0ec;--mute:#93a39b;--line:#2a3830;--acc:#3fd4a0;--accink:#06231a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:10px 14px 48px}
h1{margin:8px 0 2px;font:700 28px/1.15 ui-monospace,Menlo,Consolas,monospace;letter-spacing:-1px}
.sub{margin:0 0 12px;color:var(--mute)}
.pick{display:block;position:relative;text-align:center;padding:16px;border:2px dashed var(--line);border-radius:14px;background:var(--card);font-weight:700;cursor:pointer}
.pick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.pick:focus-within{outline:3px solid var(--acc)}
#sc{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:70vh;background:var(--card);min-height:90px}
#cv{display:block;width:100%;height:auto}
#cv.z{width:auto}
#st{margin:8px 2px;color:var(--mute);font-size:14px;min-height:21px}
.row{display:flex;gap:8px;margin-top:8px}
button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.save{width:100%;background:var(--acc);border-color:var(--acc);color:var(--accink);font-size:16px;margin-top:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:2px 14px 12px}
summary{font-weight:700;padding:11px 0;cursor:pointer}
label{display:flex;justify-content:space-between;margin:12px 0 4px;font-weight:600}
output{color:var(--mute);font-weight:400}
input[type=range]{width:100%;accent-color:var(--acc)}
select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px}
select option{color:#000}
.ck{justify-content:flex-start;gap:8px;align-items:center}
.ht{margin:4px 0 0;color:var(--mute);font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Number Art</h1>
<p class="sub">Turn any picture into numbers. Every number is chosen by measuring how it really looks, so the picture comes out accurate. Runs on your device.</p>

<label class="pick"><input type="file" id="f" accept="image/*">Choose a picture</label>
<div id="sc"><canvas id="cv" width="10" height="10"></canvas></div>
<div id="st" role="status" aria-live="polite">Pick a picture to begin.</div>
<div class="row"><button id="zm">Zoom to 100%</button><button id="cp">Copy text</button><button id="tx">Save .txt</button></div>
<button class="save" id="sv">Save PNG</button>

<div id="ctl"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), LH = 1.15;
let img = null, res = null, timer = 0, zoom = false;

const PRESETS = { digits: '0123456789', classic: '17938', ascii: ' .:-=+*#%@', custom: '' };
// [id, label, type, default, a, b, step]
const G = [
 ['1. Characters', [
  ['pre','Use','sel','digits',[['digits','Numbers 0 to 9'],['classic','Classic 1 7 9 3 8'],['ascii','Classic ASCII'],['custom','My own characters']]],
  ['cu','My own characters','tx','0123456789'],
  ['bold','Bold font','ck',true]]],
 ['2. Detail', [
  ['cols','Characters across','rg',120,40,240,2],
  ['md','Matching','sel','shape',[['shape','Shape match (most accurate)'],['tone','Tone only (faster)']]],
  ['_','Shape match compares the real outline of each number with the picture, so edges stay sharp.','ht']]],
 ['3. Tone', [
  ['auto','Auto levels (use the full dark to light range)','ck',true],
  ['ct','Contrast','rg',1.1,0.5,2.5,0.05],
  ['br','Brightness','rg',0,-0.4,0.4,0.02]]],
 ['4. Look and save size', [
  ['lk','Colours','sel','bw',[['bw','Black on white'],['wb','White on black'],['col','Coloured on black']]],
  ['sz','Saved PNG size','sel','32',[['20','Standard'],['32','Large'],['48','Huge']]]]]
];
G.forEach(([t, fs], n) => {
  const d = document.createElement('details'); d.open = n < 2;
  let h = `<summary>${t}</summary>`;
  fs.forEach(([id, lb, ty, df, a, b, s]) => {
    if (ty === 'ht') { h += `<p class="ht">${lb}</p>`; return; }
    if (ty === 'ck') { h += `<label class="ck"><input type="checkbox" id="${id}" ${df ? 'checked' : ''}> ${lb}</label>`; return; }
    h += `<label for="${id}">${lb}${ty === 'rg' ? `<output id="${id}o">${df}</output>` : ''}</label>`;
    if (ty === 'sel') h += `<select id="${id}">${a.map(o => `<option value="${o[0]}" ${o[0] === df ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
    if (ty === 'rg') h += `<input type="range" id="${id}" min="${a}" max="${b}" step="${s}" value="${df}">`;
    if (ty === 'tx') h += `<input type="text" id="${id}" value="${df}" autocomplete="off">`;
  });
  d.innerHTML = h; $('ctl').appendChild(d);
});

const val = id => $(id).value, num = id => +$(id).value;
const say = t => { $('st').textContent = t; };
const fontStr = px => `${$('bold').checked ? 'bold ' : ''}${px}px ui-monospace,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace`;
const getChars = () => [...new Set([...(val('pre') === 'custom' ? val('cu') : PRESETS[val('pre')])].filter(c => !'\n\r\t'.includes(c)))];

// Draw every character in the real font and measure how much ink it has and what shape it makes.
function glyphs(chars, tw) {
  const m = document.createElement('canvas').getContext('2d'); m.font = fontStr(100);
  const aspect = m.measureText('0').width / (100 * LH), th = Math.max(6, Math.round(tw / aspect));
  const c = document.createElement('canvas'); c.width = tw; c.height = th;
  const x = c.getContext('2d', { willReadFrequently: true });
  const list = chars.map(ch => {
    x.fillStyle = '#fff'; x.fillRect(0, 0, tw, th); x.fillStyle = '#000';
    x.font = fontStr(th / LH); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, tw / 2, th / 2);
    const d = x.getImageData(0, 0, tw, th).data, v = new Float32Array(tw * th); let ink = 0, sq = 0;
    for (let i = 0; i < v.length; i++) { v[i] = 1 - d[i * 4] / 255; ink += v[i]; sq += v[i] * v[i]; }
    return { ch, v, ink: ink / v.length, sq };
  });
  return { list, th, aspect };
}

// Shrink in steps so the picture stays clean, then read pixels.
function resample(W, H, fill) {
  let src = img, sw = img.naturalWidth, sh = img.naturalHeight;
  while (sw / 2 > W && sh / 2 > H) {
    sw = Math.round(sw / 2); sh = Math.round(sh / 2);
    const t = document.createElement('canvas'); t.width = sw; t.height = sh;
    const tx = t.getContext('2d'); tx.imageSmoothingQuality = 'high'; tx.drawImage(src, 0, 0, sw, sh); src = t;
  }
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = fill; x.fillRect(0, 0, W, H); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, W, H);
  return x.getImageData(0, 0, W, H).data;
}

function build() {
  timer = 0; if (!img) return;
  const chars = getChars();
  if (chars.length < 2) { say('Add at least 2 characters.'); return; }
  const cols = num('cols'), look = val('lk'), inv = look !== 'bw', colour = look === 'col', shape = val('md') === 'shape';
  const tw = cols > 160 ? 8 : 10, Gl = glyphs(chars, tw), th = Gl.th, n = tw * th, gl = Gl.list, L = gl.length;
  const rows = Math.max(1, Math.round(img.naturalHeight / img.naturalWidth * cols * Gl.aspect));
  const W = cols * tw, H = rows * th, D = resample(W, H, inv ? '#000' : '#fff');

  // tone: luminance -> auto levels -> contrast/brightness -> wanted ink (0 = none, 1 = full)
  const Lm = new Float32Array(W * H), hist = new Uint32Array(256);
  for (let i = 0, j = 0; j < Lm.length; i += 4, j++) { const l = (D[i] * .299 + D[i + 1] * .587 + D[i + 2] * .114) / 255; Lm[j] = l; hist[Math.min(255, l * 255 | 0)]++; }
  let lo = 0, hi = 1;
  if ($('auto').checked) {
    const t = W * H * .01; let s = 0, k = 0;
    for (; k < 256; k++) { s += hist[k]; if (s >= t) break; } lo = k / 255; s = 0;
    for (k = 255; k >= 0; k--) { s += hist[k]; if (s >= t) break; } hi = Math.max(k / 255, lo + .05);
  }
  const ct = num('ct'), br = num('br'), T = new Float32Array(W * H);
  for (let j = 0; j < T.length; j++) { let l = (Lm[j] - lo) / (hi - lo); l = (l - .5) * ct + .5 + br; l = l < 0 ? 0 : l > 1 ? 1 : l; T[j] = inv ? l : 1 - l; }

  // pick, for every cell, the character whose real shape fits best
  const maxInk = Math.max(...gl.map(g => g.ink)), minInk = Math.min(...gl.map(g => g.ink));
  gl.forEach(g => { g.vc = g.v.map(a => a - g.ink); g.sqc = g.vc.reduce((t, a) => t + a * a, 0); });
  const idx = new Uint8Array(rows * cols), cc = colour ? new Uint8ClampedArray(rows * cols * 3) : null, tl = new Float32Array(n);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    let sum = 0, sq2 = 0, k = 0, best = 0, R = 0, Gc = 0, B = 0;
    for (let y = 0; y < th; y++) {
      const o = (r * th + y) * W + c * tw;
      for (let x = 0; x < tw; x++) {
        const v = T[o + x]; tl[k++] = v; sum += v; sq2 += v * v;
        if (colour) { const p = (o + x) * 4; R += D[p]; Gc += D[p + 1]; B += D[p + 2]; }
      }
    }
    // tone: map the cell's average darkness onto the real ink range of the chosen characters
    // shape: on cells with edges, also compare the outline (average removed) with each character
    const mT = sum / n, tone = minInk + mT * (maxInk - minInk), sw = Math.min(1, (sq2 / n - mT * mT) * 10);
    let bs = 1e9;
    for (let g = 0; g < L; g++) {
      const e = tone - gl[g].ink; let sc = n * e * e * 30;
      if (shape) { const v = gl[g].vc; let d = 0; for (let q = 0; q < n; q++) d += tl[q] * v[q]; sc += sw * (gl[g].sqc - 2 * d); }
      if (sc < bs) { bs = sc; best = g; }
    }
    idx[r * cols + c] = best;
    if (colour) { const q = (r * cols + c) * 3; cc[q] = R / n; cc[q + 1] = Gc / n; cc[q + 2] = B / n; }
  }
  res = { chars: gl.map(g => g.ch), idx, cc, cols, rows, inv, colour };
  paint(cv, 16);
  const order = gl.slice().sort((a, b) => a.ink - b.ink).map(g => g.ch).join(' ');
  say(`${cols} x ${rows} characters. Light to dark order measured: ${order.length > 40 ? order.slice(0, 40) + '…' : order}`);
}

const lineOf = r => { let s = ''; for (let c = 0; c < res.cols; c++) s += res.chars[res.idx[r * res.cols + c]]; return s; };

function paint(c, fs) {
  const m = document.createElement('canvas').getContext('2d'); m.font = fontStr(fs);
  const adv = m.measureText('0').width, ph = fs * LH;
  c.width = Math.round(adv * res.cols); c.height = Math.round(ph * res.rows);
  const x = c.getContext('2d');
  x.fillStyle = res.inv ? '#000' : '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.font = fontStr(fs); x.textBaseline = 'middle'; x.textAlign = 'left'; x.fillStyle = res.inv ? '#fff' : '#000';
  for (let r = 0; r < res.rows; r++) {
    if (res.colour) {
      for (let k = 0; k < res.cols; k++) {
        const q = (r * res.cols + k) * 3; x.fillStyle = `rgb(${res.cc[q]},${res.cc[q + 1]},${res.cc[q + 2]})`;
        x.fillText(res.chars[res.idx[r * res.cols + k]], k * adv, (r + .5) * ph);
      }
    } else x.fillText(lineOf(r), 0, (r + .5) * ph);
  }
}

function sched() { say('Working…'); clearTimeout(timer); timer = setTimeout(build, 150); }

function load(file) {
  if (!file) return;
  const im = new Image(), u = URL.createObjectURL(file);
  im.onload = () => { img = im; URL.revokeObjectURL(u); build(); };
  im.onerror = () => say('Could not open that picture (HEIC is not supported). Try a JPG or PNG.');
  im.src = u;
}
$('f').onchange = e => load(e.target.files[0]);
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); load(e.dataTransfer.files[0]); });

$('ctl').addEventListener('input', e => {
  if (e.target.type === 'range') $(e.target.id + 'o').textContent = e.target.value;
  if (e.target.id === 'cu') $('pre').value = 'custom';
  if (img) sched();
});

function save(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 8000);
}
const need = () => { if (!res) { say('Pick a picture first.'); return false; } return true; };
$('zm').onclick = () => { zoom = !zoom; cv.classList.toggle('z', zoom); $('zm').textContent = zoom ? 'Fit to screen' : 'Zoom to 100%'; };
$('tx').onclick = () => { if (need()) save(new Blob([Array.from({ length: res.rows }, (_, r) => lineOf(r)).join('\n')], { type: 'text/plain' }), 'number-art.txt'); };
$('cp').onclick = async () => {
  if (!need()) return;
  try { await navigator.clipboard.writeText(Array.from({ length: res.rows }, (_, r) => lineOf(r)).join('\n')); say('Text copied.'); }
  catch (e) { say('Copy was blocked here. Use Save .txt instead.'); }
};
$('sv').onclick = () => {
  if (!need()) return;
  const c = document.createElement('canvas');
  paint(c, Math.min(num('sz'), 8000 / Math.max(res.cols * .65, res.rows * LH)));
  c.toBlob(b => { save(b, 'number-art.png'); say('Saved number-art.png'); }, 'image/png');
};
</script>
</body>
</html>
